name: Deploy

# Only main deploys, and only after CI is green. The AWS role's trust policy
# enforces the same thing on the AWS side, so a workflow edited on a branch
# still cannot obtain credentials.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

env:
  IMAGE_TAG: ${{ github.sha }}

jobs:

  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  build-and-push:
    name: Push image to ECR
    runs-on: ubuntu-latest
    needs: ci
    timeout-minutes: 25

    permissions:
      # Required to request the OIDC token that AWS exchanges for temporary
      # credentials. This is why no AWS access key exists in this repository.
      id-token: write
      contents: read

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Assume the deployment role via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: gha-build-${{ github.run_id }}

      - name: Log in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Tagged with the commit SHA only. The ECR repository uses immutable
      # tags, so this tag can never point at different bytes later, and any
      # past deploy can be reproduced exactly.
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          provenance: false
          tags: ${{ vars.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summarise
        run: |
          echo "### Image pushed" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "${{ vars.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: build-and-push
    timeout-minutes: 15

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Assume the deployment role via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: gha-deploy-${{ github.run_id }}

      - name: Confirm the instance is registered with Systems Manager
        run: |
          STATUS=$(aws ssm describe-instance-information \
            --filters "Key=InstanceIds,Values=${{ vars.EC2_INSTANCE_ID }}" \
            --query 'InstanceInformationList[0].PingStatus' \
            --output text)
          echo "Ping status: $STATUS"
          if [ "$STATUS" != "Online" ]; then
            echo "::error::Instance ${{ vars.EC2_INSTANCE_ID }} is not reachable through SSM."
            exit 1
          fi

      # The deploy script is sent to the instance rather than stored on it, so
      # the version in this commit is the version that runs. Base64 keeps the
      # script intact through the SSM parameter encoding.
      - name: Run the deployment on the instance
        id: send
        run: |
          SCRIPT_B64=$(base64 -w0 scripts/deploy.sh)

          PAYLOAD=$(jq -n \
            --arg b64 "$SCRIPT_B64" \
            --arg tag "${{ env.IMAGE_TAG }}" \
            '{commands: [
                "set -euo pipefail",
                ("echo " + $b64 + " | base64 -d > /tmp/deploy.sh"),
                "chmod +x /tmp/deploy.sh",
                ("/tmp/deploy.sh " + $tag)
              ]}')

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ vars.EC2_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy ${{ env.IMAGE_TAG }}" \
            --timeout-seconds 600 \
            --parameters "$PAYLOAD" \
            --query 'Command.CommandId' \
            --output text)

          echo "Command: $COMMAND_ID"
          echo "command_id=$COMMAND_ID" >> "$GITHUB_OUTPUT"

          for _ in $(seq 1 90); do
            STATE=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "${{ vars.EC2_INSTANCE_ID }}" \
              --query 'Status' --output text 2>/dev/null || echo Pending)
            case "$STATE" in
              Success)   echo "Deployment command succeeded"; break ;;
              Failed|Cancelled|TimedOut) echo "Deployment command ended as $STATE" ;;
              *)         sleep 5; continue ;;
            esac
            break
          done

          echo "----- stdout -----"
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ vars.EC2_INSTANCE_ID }}" \
            --query 'StandardOutputContent' --output text || true

          echo "----- stderr -----"
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ vars.EC2_INSTANCE_ID }}" \
            --query 'StandardErrorContent' --output text || true

          FINAL=$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ vars.EC2_INSTANCE_ID }}" \
            --query 'Status' --output text)

          if [ "$FINAL" != "Success" ]; then
            echo "::error::Deployment failed on the instance (status: $FINAL)"
            exit 1
          fi

      # Verifying from the instance's own loopback is not enough: this proves
      # the security group and public address actually serve traffic.
      - name: Verify the service is reachable from the internet
        run: |
          PUBLIC_IP=$(aws ec2 describe-instances \
            --instance-ids "${{ vars.EC2_INSTANCE_ID }}" \
            --query 'Reservations[0].Instances[0].PublicIpAddress' \
            --output text)

          echo "Public address: $PUBLIC_IP"

          for i in $(seq 1 20); do
            if curl -fsS --max-time 5 "http://$PUBLIC_IP:8080/actuator/health" | grep -q '"status":"UP"'; then
              echo "Service is reachable and healthy."
              {
                echo "### Deployed"
                echo ""
                echo "- Commit: \`${{ env.IMAGE_TAG }}\`"
                echo "- Health: http://$PUBLIC_IP:8080/actuator/health"
                echo "- API docs: http://$PUBLIC_IP:8080/swagger-ui.html"
              } >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 5
          done

          echo "::error::Deployed, but the service is not reachable at http://$PUBLIC_IP:8080"
          exit 1
