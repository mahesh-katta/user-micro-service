# Test config. Datasource is supplied at runtime by Testcontainers via @ServiceConnection.
spring:
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true

jwt:
  secret: test-secret-key-that-is-definitely-long-enough-for-hmac-sha256-signing
  access-token-expiration-ms: 900000
  refresh-token-expiration-ms: 604800000

logging:
  level:
    com.maheshreddy.userservice: INFO
    org.testcontainers: INFO
